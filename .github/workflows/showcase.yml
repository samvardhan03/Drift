name: Showcase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tripwire — proprietary keywords
        run: |
          HITS=$(grep -rInE "hmmlearn|GaussianHMM|kiteconnect|pyotp|omni_ffi|KITE_|TOTP|sk_live|whsec_" \
            --include='*.py' --include='*.toml' src/ pyproject.toml || true)
          if [ -n "$HITS" ]; then
            echo "TRIPWIRE HIT: $HITS"
            exit 1
          fi
          echo "Tripwire content: clean"

      - name: Tripwire — strip-list paths
        run: |
          HITS=$(git ls-files | grep -E \
            "features/(wst|regime|factors|comovement)\.py|src/alpha/|portfolio/(black_litterman|omega|hrp|cvar)\.py|risk/(covariance|factor_model|stress)\.py|src/backtest/|src/report/|advisor\.py|providers/kite\.py|kite_(auto_refresh|login)\.py|feature_store\.py|token_store\.py|src/scripts/|dashboard/live\.py" \
            || true)
          if [ -n "$HITS" ]; then
            echo "STRIP-LIST PATH FOUND: $HITS"
            exit 1
          fi
          echo "Tripwire paths: clean"

      - name: Run pytest
        run: pytest tests/ -v --ignore=tests/test_showcase.py::test_tripwire_paths

      - name: Boot API and verify routes
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          bash scripts/verify_showcase.sh http://localhost:8000
          kill %1
