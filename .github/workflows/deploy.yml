name: Deploy to Cloud Run

# Fires on every push that lands on main -- including a merged PR, since
# GitHub sends a push event for the merge commit itself. A separate
# `pull_request: types: [closed]` trigger would double-deploy the same
# commit, so it's deliberately not added.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for google-github-actions/auth's Workload Identity
  # Federation exchange (no long-lived service account key is stored in
  # this repo).
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${{ vars.GCP_PROJECT_ID }}/drift-risk-copilot"
          # Explicit staging bucket with clean uniform-bucket-level IAM,
          # rather than gcloud's default <project>_cloudbuild bucket: that
          # default bucket predates uniform bucket-level access and only
          # grants legacy ACLs to the project owners/editors/viewers
          # groups, which github-deployer isn't a member of (granting it
          # storage.admin directly on that legacy bucket did not resolve
          # a "forbidden from accessing the bucket" error -- worth
          # revisiting if GCP support clarifies why, but this sidesteps it
          # cleanly).
          #
          # --async, not a blocking `gcloud builds submit`: the blocking
          # form tries to stream build logs back to the caller, which
          # requires the caller to be a project Viewer/Owner ("This tool
          # can only stream logs if you are Viewer/Owner of the
          # project..."). github-deployer deliberately isn't (least
          # privilege), and granting roles/logging.viewer did not satisfy
          # that check either (confirmed via a live run) -- so submit
          # async and poll `gcloud builds describe` instead, which only
          # needs cloudbuild.builds.get (already covered by
          # roles/cloudbuild.builds.editor).
          BUILD_ID=$(gcloud builds submit \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --gcs-source-staging-dir="gs://${{ vars.GCP_PROJECT_ID }}-ci-source/cloudbuild-source" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --async \
            --format="value(id)" \
            .)
          echo "Cloud Build ID: ${BUILD_ID}"

          # This is a Rust workspace build; a clean Cloud Build run has taken
          # upwards of 17 minutes (see the run for PR #4), so the poll
          # budget needs real headroom above that, not just above the
          # median build time.
          for i in $(seq 1 180); do
            STATUS=$(gcloud builds describe "${BUILD_ID}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --format="value(status)")
            echo "[$i] build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build ${BUILD_ID} ended with status ${STATUS}" >&2
                exit 1
                ;;
            esac
            if [ "$i" -eq 180 ]; then
              echo "Timed out waiting for Cloud Build ${BUILD_ID}" >&2
              exit 1
            fi
            sleep 10
          done
          gcloud container images add-tag \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest" \
            --quiet

      - name: Render cloudrun.yaml for this project/build
        run: |
          set -euo pipefail
          sed \
            -e "s#gcr.io/PROJECT_ID/drift-risk-copilot:latest#gcr.io/${{ vars.GCP_PROJECT_ID }}/drift-risk-copilot:${{ github.sha }}#" \
            cloudrun.yaml > cloudrun.deploy.yaml
          cat cloudrun.deploy.yaml

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run services replace cloudrun.deploy.yaml \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region=asia-south1

      - name: Smoke test
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe drift-risk-copilot \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region=asia-south1 \
            --format="value(status.url)")
          echo "Deployed: ${URL}"
          curl -sf "${URL}/health" | tee /dev/stderr | grep -q '"status":"ok"'
